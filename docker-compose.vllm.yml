name: llm-server
services:
  vllm:
    image: vllm/vllm-openai:latest-cu130
    ipc: host
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_FLASH_ATTN_VERSION=2
      - NVIDIA_VISIBLE_DEVICES=all
      - LD_PRELOAD=/lib/x86_64-linux-gnu/libcuda.so.1
      - HF_HUB_OFFLINE=1
      - VLLM_API_KEY=${VLLM_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: [
      "mistralai/Ministral-3-3B-Instruct-2512-BF16",
      "--dtype", "bfloat16",
      "--tensor-parallel-size", "1",
      "--max-model-len", "131072",
      "--kv-cache-dtype", "fp8",
      "--gpu-memory-utilization", "0.90",
      "--swap-space", "4",
      "--api-key", "${VLLM_API_KEY}"
    ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

volumes:
  hf-cache:
