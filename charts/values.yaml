name: ai-analysis-service
replicaCount: 1
image:
  repository: ghcr.io/visiobook-esp/ai-analysis-service-dev
  tag: "sha-f5d07da"
  pullPolicy: IfNotPresent

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0  # l'ancien pod reste vivant tant que le nouveau n'est pas prêt
    maxSurge: 1        # autorise 1 pod en plus pendant le rollout

revisionHistoryLimit: 3 # nombre de revision garder sur un pod
progressDeadlineSeconds: 60 # temps max pour que le pod soit opérationnel avant de considérer que le déploiement a échoué
minReadySeconds: 10 # le pod doit être stable 10s avant d'être considéré Available (évite les faux positifs)
terminationGracePeriodSeconds: 10 # délai avant SIGKILL (30s par défaut, réduit pour les tests)

existingSecret: ""

service:
  type: NodePort
  port: 80
  nodePort: 30083

istio:
  enabled: true
  injection: true

  virtualService:
    enabled: true
    hosts:
      - "ai-analysis-service"
      - "ai-analysis-service.visiobook.dev"
    gateways:
      - mesh
  destinationRule:
    enabled: true
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 100
        http:
          http1MaxPendingRequests: 100
          http2MaxRequests: 100
          maxRequestsPerConnection: 2
      loadBalancer:
        simple: ROUND_ROBIN
      outlierDetection:
        consecutiveErrors: 5
        interval: 30s
        baseEjectionTime: 30s

  mtls:
    enabled: true
    mode: ISTIO_MUTUAL

nodeSelector: {}
tolerations: []
affinity: {}

podLabels:
  app: ai-analysis-service
  version: "latest"
  app.kubernetes.io/name: ai-analysis-service
  app.kubernetes.io/version: "latest"
  app.kubernetes.io/component: backend

selectorLabels:
  app: ai-analysis-service
  version: latest

resources: {}

env:
  APP_NAME: ai-analysis-service
  APP_VERSION: 0.1.0
  APP_PORT: 8083
  SUMMARIZER_MODEL: facebook/bart-large-cnn
  VLLM_BASE_URL: http://100.120.93.126:8000
  VLLM_API_KEY: 89f6f043c3cac05ee245f9d61fe2dc2ea43a0fe9688d695d512bdfa712bfb693
  NATS_URL: nats://nats.visiobook-namespace.svc.cluster.local:4222
  NATS_USER: ""
  NATS_PASSWORD: ""
  NATS_STREAM_NAME: VISIOBOOK_PROJECT