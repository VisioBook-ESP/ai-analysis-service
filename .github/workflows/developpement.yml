name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  formatage-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install black
        run: pip install black==25.9.0

      - name: Check formatting with black
        run: black --check src/

  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/

  pylint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pylint
        run: pip install pylint

      - name: Run pylint
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pylint src/ --fail-under=7.0 || true

  types-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: mypy src/ --ignore-missing-imports || true

  no-debug-leftovers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for debug statements
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(pdb\.set_trace\(|(^|[^[:alnum:]_])print\(|breakpoint\()' -- '*.py' ':!tests/**'; then
            echo "::error:: Python debug statements found (see matches above)." >&2
            exit 1
          fi
          echo "✅ No debug leftovers found"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest

  smoke-test:
    runs-on: ubuntu-latest
    needs:
      [
        formatage-check,
        ruff-check,
        pylint-check,
        types-check,
        no-debug-leftovers,
        unit-tests,
      ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "APP_PORT=8083" > .env
          echo "LOG_LEVEL=INFO" >> .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for service to be healthy
        run: |
          echo "Waiting for service to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:8083/health; then
              echo ""
              echo "Service is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - Service not ready yet..."
            sleep 5
          done
          echo "Service failed to start"
          docker compose logs
          exit 1

      - name: Verify health endpoint response
        run: |
          RESPONSE=$(curl -sf http://localhost:8083/health)
          echo "Health response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
            echo "Health check passed!"
          else
            echo "Unexpected health response"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v
